name: CI

on:
  pull_request:
  push:
    # filtering branches here prevents duplicate builds from pull_request and push
    branches:
      - main

# cancel older runs for the same branch/PR when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# principle of least privilege for GITHUB_TOKEN
permissions:
  contents: read

env:
  CI: true

jobs:
  validation:
    name: Project Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Cache ESLint results
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('**/pnpm-lock.yaml', '.eslintrc*', 'eslint.config.*') }}
          restore-keys: |
            eslint-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-
            eslint-${{ runner.os }}-
            eslint-

      - name: Run ESLint
        run: |
          pnpm lint --cache --cache-location .eslintcache

      - name: Run TypeScript Checks
        run: pnpm type-check

      - name: Build Site
        run: pnpm build

      - name: Check Internal Links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --root-dir "${{ github.workspace }}/dist"
            --index-files index.html
            --no-progress
            '${{ github.workspace }}/dist/**/*.html'
          fail: true
          jobSummary: true

      - name: Run Browser Smoke Tests
        run: pnpm test:e2e

      - name: Audit Dependencies
        run: pnpm audit --audit-level high
